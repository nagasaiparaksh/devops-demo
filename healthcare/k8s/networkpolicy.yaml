# 1) Deny all traffic in the namespace by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: healthcare
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# 2) Allow only what is needed: the API pods accept port 3000 from the "default" namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
  namespace: healthcare
spec:
  podSelector:
    matchLabels:
      app: patient-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 3000
