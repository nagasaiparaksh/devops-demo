apiVersion: apps/v1
kind: Deployment
metadata:
  name: bg-demo-__COLOR__
  labels:
    app: bg-demo
    color: __COLOR__
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bg-demo
      color: __COLOR__
  template:
    metadata:
      labels:
        app: bg-demo
        color: __COLOR__
    spec:
      containers:
        - name: app
          image: __IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: APP_COLOR
              value: "__COLOR__"
            - name: APP_VERSION
              value: "__VERSION__"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
